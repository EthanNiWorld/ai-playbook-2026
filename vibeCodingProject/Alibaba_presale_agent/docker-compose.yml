services:
  alibaba-presale-agent:
    build:
      context: .
      args:
        # 国内网络环境建议在 .env 里打开这两项（见 README「国内网络」）
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: alibaba-presale-agent:latest
    container_name: alibaba-presale-agent
    restart: unless-stopped
    ports:
      - "8000:8000"          # nginx 反代到本端口；无 nginx 时可直连
    environment:
      # 缺失时立即报错退出，避免启动成功但每次提问才 401
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 中填写 DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      QA_MODEL: ${QA_MODEL:-qwen3.8-max}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 知识来源：默认拉取 ai-playbook-2026 的两个目录，可换成自己的知识库仓库
      KNOWLEDGE_REPO_URL: ${KNOWLEDGE_REPO_URL:-https://github.com/EthanNiWorld/ai-playbook-2026.git}
      KB_SYNC_INTERVAL_HOURS: ${KB_SYNC_INTERVAL_HOURS:-24}
      PRICE_PAGE_TTL_HOURS: ${PRICE_PAGE_TTL_HOURS:-6}
      # 容器内一律走 GitHub sparse clone，不要设置 LOCAL_KNOWLEDGE_PATH
    volumes:
      # named volume：避免宿主目录属主与容器内 appuser(10001) 不一致导致写失败
      - alibaba-presale-agent-data:/app/data

volumes:
  alibaba-presale-agent-data:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
<meta name="theme-color" content="#fcfbf9"/>
<title>阿里小可爱 EthanNi的小助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d0d0d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff6a00'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="/static/style.css?v=20261110a"/>
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar" aria-label="侧边栏">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">阿里小可爱</span>
    </div>
    <div class="brand-sub">EthanNi 的小助手</div>

    <button id="newSession" class="btn ghost">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      新会话
    </button>

    <a class="guide-link" href="/guide" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/>
        <path d="M8 7.5h8M8 11.5h6"/>
      </svg>
      <span class="guide-link-text">
        <span class="guide-link-title">售前指南</span>
        <span class="guide-link-hint">API 销售快速指南</span>
      </span>
      <svg class="guide-link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7M9 7h8v8"/>
      </svg>
    </a>

    <div class="sidebar-note">
      <span class="sidebar-note-title">从一个问题开始</span>
      <p>选模型、查价格、聊方案。<br/>像聊天一样，说说你的需求。</p>
    </div>

    <div class="foot">
      <span class="foot-label">有依据的回答，更安心的选择</span>
      <p>价格类问题自动联网核实官方定价页</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-brand">
        <button id="sidebarToggle" class="icon-btn" aria-label="收起侧边栏" title="收起侧边栏" aria-controls="sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <span class="topbar-title">阿里小可爱<span class="topbar-sub">万能、7*24小时的任劳任怨的AI架构师</span></span>
      </div>
      <div class="topbar-actions">
        <a class="icon-btn topbar-guide" href="/guide" target="_blank" rel="noopener" title="售前指南" aria-label="售前指南">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/>
            <path d="M8 7.5h8M8 11.5h6"/>
          </svg>
        </a>
        <button id="newSessionTop" class="btn topbar-new" disabled>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新会话
        </button>
      </div>
    </header>
    <div id="workspace" class="workspace is-empty">
      <div id="chat" class="chat" role="region" aria-label="对话内容"></div>
      <div class="composer-wrap">
        <button id="jumpLatest" class="jump-latest" type="button" hidden>↓ 回到最新</button>
        <div id="statusBar" class="status-bar" role="status" hidden></div>
        <div id="queueBar" class="queue-bar" role="status" aria-live="polite" hidden></div>
        <div class="composer">
          <textarea id="input" rows="2" placeholder="向阿里小可爱提问" aria-label="输入你的问题" aria-describedby="inputHint"></textarea>
          <div class="composer-actions">
            <span id="inputHint" class="input-hint">Enter 发送<span> · Shift + Enter 换行</span></span>
            <div class="composer-btns">
              <button id="mic" class="mic-btn" aria-label="语音输入" title="点击开始录音（最长 60 秒），再点结束并转文字" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="2" width="6" height="12" rx="3"/>
                  <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
                  <path d="M12 18v4"/>
                </svg>
              </button>
              <button id="attach" class="attach-btn" aria-label="上传截图" title="上传截图（可粘贴/拖拽，最多 4 张）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" multiple hidden>
              <button id="stop" class="send-btn stop-btn" aria-label="停止生成" title="停止生成" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor" stroke="none"/>
                </svg>
              </button>
              <button id="send" class="send-btn" aria-label="发送" title="发送" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="suggestions" class="tips" aria-label="推荐问题">
          <div class="tips-title">也可以从这里开始</div>
          <div class="suggestion-grid">
            <button class="chip" data-q="Qwen3.8-Max 的价格是多少？">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 11h2m4 0h2M8 15h2m4 0h2M8 18h2m4 0h2"/></svg>
              <span><strong>查模型价格</strong><small>了解定价与计费方式</small></span>
              <span class="chip-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="chip" data-q="qwen3.8-max 和 deepseek-v4.1-flash 哪个更适合长文本 RAG 场景？">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M16 4v16M5 8h6m2 8h6"/><circle cx="8" cy="8" r="2"/><circle cx="16" cy="16" r="2"/></svg>
              <span><strong>做模型选型</strong><small>找到适合业务的模型</small></span>
              <span class="chip-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="chip" data-q="百炼平台上怎么搭建一个多 Agent 协作的应用？">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="6" rx="2"/><rect x="2" y="15" width="8" height="6" rx="2"/><rect x="14" y="15" width="8" height="6" rx="2"/><path d="M12 9v3M6 15v-3h12v3"/></svg>
              <span><strong>搭建 Agent</strong><small>探索应用与协作方案</small></span>
              <span class="chip-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="chip" data-q="Wan3.0-Video 视频生成支持哪些分辨率和规格？">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg>
              <span><strong>探索视频生成</strong><small>了解万相的能力与规格</small></span>
              <span class="chip-arrow" aria-hidden="true">↗</span>
            </button>
          </div>
        </div>
        <div class="disclaimer">回答可能不准确，价格请以阿里云官方定价页为准</div>
      </div>
    </div>
  </main>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/app.js?v=20261110a"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>阿里小可爱AI问答助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d0d0d'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff6a00'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="/static/style.css?v=20261106a"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">阿里小可爱</span>
    </div>
    <div class="brand-sub">AI 问答助手</div>

    <button id="newSession" class="btn ghost">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      新会话
    </button>

    <div class="tips">
      <div class="tips-title">试试问</div>
      <button class="chip" data-q="Qwen3.8-Max 的价格是多少？">Qwen3.8-Max 定价</button>
      <button class="chip" data-q="qwen3.8-max 和 deepseek-v4-pro 哪个更适合长文本 RAG 场景？">模型选型对比</button>
      <button class="chip" data-q="百炼平台上怎么搭建一个多 Agent 协作的应用？">Agent 搭建</button>
      <button class="chip" data-q="Wan3.0-Video 视频生成支持哪些分辨率和规格？">Wan3.0 视频规格</button>
    </div>

    <div class="foot">模型价格 · 模型能力 · Agent 产品<br/>价格类问题自动联网核实官方定价页</div>
  </aside>

  <main class="main">
    <div id="chat" class="chat"></div>
    <div class="composer-wrap">
      <div id="statusBar" class="status-bar" hidden></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="向阿里小可爱提问"></textarea>
        <button id="send" class="send-btn" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
      <div class="disclaimer">回答可能不准确，价格请以阿里云官方定价页为准</div>
    </div>
  </main>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/app.js?v=20261106a"></script>
</body>
</html>
